name: Deploy to GitHub Pages

# Phase 12: production publishing requires an explicit manual release decision.
# Configure required reviewers for the `diary-production` GitHub environment.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY_APPROVED after all release acceptance checks pass'
        required: true
        type: string

concurrency:
  group: diary-pages-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY_APPROVED' }}
    runs-on: ubuntu-latest
    environment:
      name: diary-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify private-source privacy
        run: npm run verify:privacy

      - name: Audit Firestore rules source (static, not live)
        run: npm run verify:rules-static

      - name: Verify dependency lock and Android integration
        run: node scripts/verify-release-setup.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify Firebase configuration
        run: node scripts/verify-firebase-config.mjs
        env:
          VITE_OWNER_UID: ${{ secrets.VITE_OWNER_UID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_OWNER_UID: ${{ secrets.VITE_OWNER_UID }}
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}

      - name: Audit deployable assets for private content
        run: npm run verify:dist

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
