name: Sync Steam Stats

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: steam-stats-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Steam Sync
        run: node scripts/sync-steam.mjs
        env:
          STEAM_ID64: ${{ secrets.STEAM_ID64 || '76561198417375364' }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/steam-stats.json
          git diff --staged --quiet || (git commit -m "chore(steam): update steam stats [skip ci]" && git push)
