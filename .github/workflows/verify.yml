name: Verify My Diary Changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Source privacy gate
        run: node scripts/verify-private-source.mjs
      - name: Reviewed Firestore rules static gate
        run: node scripts/verify-firebase-rules-static.mjs
      - name: Phase 12 release gate
        run: node scripts/phase12-release-gates.mjs --strict
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Regression suite
        run: npm test
